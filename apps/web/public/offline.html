<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Crustulator</title>
    <style>
      html {
        background: #fff888;
        color: #4a1215;
        font: 400 1.0625rem / 1.5 "Helvetica Neue", Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        color: #fb3a44;
        font-size: 2rem;
      }
      a {
        color: #fb3a44;
        font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #2a0d0f;
          color: #fff888;
        }
      }
    </style>
  </head>
  <body>
    <h1>No connection</h1>
    <p>Crustulator needs one visit online before it works offline.</p>
    <p><a href="/">Try again</a></p>
  </body>
</html>
